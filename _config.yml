title: "SecNotes"
description: "Siber güvenlik araştırmaları"
author: "Berat"
# Kullanıcı sitesi (kullanici.github.io) ise baseurl boş kalmalı.
# Proje sitesi (kullanici.github.io/repo-adi) ise: baseurl: "/repo-adi"
baseurl: ""

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
