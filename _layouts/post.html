---
layout: default
---
<article class="post">
  <header class="post-head">
    <h1>{{ page.title }}</h1>
    {% if page.date %}<p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%d.%m.%Y' }}</time></p>{% endif %}
  </header>

  <div class="post-body">
    {{ content }}
  </div>

  <p class="back"><a href="{{ '/' | relative_url }}">&larr; Tüm araştırmalar</a></p>
</article>
